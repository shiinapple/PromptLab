<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shiinapple 设计令牌</title>
  <style id="design-tokens">
/* ============================================================
   色彩系统 · Apple-inspired · Shiinapple Design System
   ============================================================ */

:root, [data-theme="light"] {

  /* ── Mint（主品牌色，冷纯绿，无黄调）── */
  --color-mint-50:  #eaf7f2;
  --color-mint-100: #c0eada;
  --color-mint-200: #8dd4be;
  --color-mint-300: #52b99e;
  --color-mint-400: #1e9e81;
  --color-mint-500: #00856a;
  --color-mint-600: #00745e;
  --color-mint-700: #006050;
  --color-mint-800: #004a3d;
  --color-mint-900: #003028;

  /* ── Blue（信息/链接，对齐 Apple Blue 色域）── */
  --color-blue-50:  #e5f0ff;
  --color-blue-100: #b8d4ff;
  --color-blue-200: #85b5ff;
  --color-blue-300: #4d93ff;
  --color-blue-400: #1a72ff;
  --color-blue-500: #0057e0;
  --color-blue-600: #0046c0;
  --color-blue-700: #0038a0;
  --color-blue-800: #002a7a;
  --color-blue-900: #001d55;

  /* ── Cyan ── */
  --color-cyan-50:  #e3f8fd;
  --color-cyan-100: #bdeef8;
  --color-cyan-200: #8de0f2;
  --color-cyan-300: #55ceea;
  --color-cyan-400: #1ab8de;
  --color-cyan-500: #009ec8;
  --color-cyan-600: #0088b0;
  --color-cyan-700: #006e92;
  --color-cyan-800: #005470;
  --color-cyan-900: #003a4e;

  /* ── Amber（对齐 Apple Yellow #FF9F0A 色域）── */
  --color-amber-50:  #fff8e6;
  --color-amber-100: #ffedba;
  --color-amber-200: #ffdf82;
  --color-amber-300: #ffce4a;
  --color-amber-400: #ffbe1a;
  --color-amber-500: #f5a800;
  --color-amber-600: #d48c00;
  --color-amber-700: #a86f00;
  --color-amber-800: #7f5200;
  --color-amber-900: #553700;

  /* ── Red（对齐 Apple Red #FF3B30 色域）── */
  --color-red-50:  #fff0ee;
  --color-red-100: #ffd5d1;
  --color-red-200: #ffb0aa;
  --color-red-300: #ff8780;
  --color-red-400: #ff5a52;
  --color-red-500: #f02b22;
  --color-red-600: #cc2018;
  --color-red-700: #a81710;
  --color-red-800: #800e09;
  --color-red-900: #550705;

  /* ── 中性色（Apple 冷灰，带极轻蓝调）── */
  --color-page:          #f2f2f7;
  --color-card:          #ffffff;
  --color-secondary:     #f2f2f7;
  --color-muted:         #e5e5ea;
  --color-floating:      #ffffffd0;
  --color-field:         #ffffff;
  --color-line:          #c6c6cb;

  --color-ink:           #1c1c1e;
  --color-secondary-ink: #3c3c43;
  --color-muted-ink:     #6e6e73;
  --color-placeholder:   #8e8e93;
  --color-disabled-ink:  #aeaeb2;
  --color-link:          #0057e0;

  /* ── 语义令牌 ── */
  --color-primary:          var(--color-mint-500);
  --color-on-primary:       #ffffff;
  --color-primary-pressed:  var(--color-mint-600);
  --color-primary-disabled: var(--color-mint-200);

  --color-success-text:    var(--color-mint-600);
  --color-success-surface: var(--color-mint-50);
  --color-success-border:  var(--color-mint-100);

  --color-danger:          var(--color-red-500);
  --color-danger-pressed:  var(--color-red-600);
  --color-error-text:      var(--color-red-600);
  --color-error-surface:   var(--color-red-50);
  --color-error-border:    var(--color-red-100);

  --color-warning-text:    var(--color-amber-700);
  --color-warning-surface: var(--color-amber-50);
  --color-warning-border:  var(--color-amber-200);

  --color-info:            var(--color-blue-500);
  --color-info-text:       var(--color-blue-600);
  --color-info-surface:    var(--color-blue-50);
  --color-info-border:     var(--color-blue-100);
  --color-info-pressed:    var(--color-blue-700);

  --color-track:           #e5e5ea;
  --color-on-solid:        #ffffff;
  --color-swatch-light:    #ffffff;
  --color-swatch-dark:     #1c1c1e;

  /* ── 阴影（双层，极轻）── */
  --shadow-card:    0 1px 3px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
  --shadow-raised:  0 2px 8px rgba(0,0,0,.09), 0 8px 32px rgba(0,0,0,.07);
  --shadow-overlay: 0 8px 24px rgba(0,0,0,.13), 0 24px 64px rgba(0,0,0,.10);

  /* ── 图表 ── */
  --color-chart-mint:  var(--color-mint-500);
  --color-chart-blue:  var(--color-blue-400);
  --color-chart-cyan:  var(--color-cyan-500);
  --color-chart-amber: var(--color-amber-500);
  --color-chart-red:   var(--color-red-400);
}


/* ── 深色模式 ── */
[data-theme="dark"] {

  /* Amber 深色反转 */
  --color-amber-50:  #3a2e0a;
  --color-amber-100: #4e3d0d;
  --color-amber-200: #614c10;
  --color-amber-300: #765b13;
  --color-amber-400: #957618;
  --color-amber-500: #f5a800;
  --color-amber-600: #f7c233;
  --color-amber-700: #fad966;
  --color-amber-800: #fcec99;
  --color-amber-900: #fff8e6;

  /* Red 深色反转 */
  --color-red-50:  #3a0f0d;
  --color-red-100: #4e1511;
  --color-red-200: #611c16;
  --color-red-300: #74231b;
  --color-red-400: #9a3029;
  --color-red-500: #ff5a52;
  --color-red-600: #ff8077;
  --color-red-700: #ffa39d;
  --color-red-800: #ffc8c5;
  --color-red-900: #fff0ee;

  /* ── 中性色（Apple 深色，纯黑系）── */
  --color-page:          #000000;
  --color-card:          #1c1c1e;
  --color-secondary:     #2c2c2e;
  --color-muted:         #3a3a3c;
  --color-floating:      #2c2c2ed8;
  --color-field:         #2c2c2e;
  --color-line:          #38383a;

  --color-ink:           #ffffff;
  --color-secondary-ink: #c7c7cc;
  --color-muted-ink:     #8e8e93;
  --color-placeholder:   #636366;
  --color-disabled-ink:  #48484a;
  --color-link:          #4d93ff;

  /* ── 语义令牌深色覆盖 ── */
  --color-primary:          #30c88a;
  --color-on-primary:       #002d20;
  --color-primary-pressed:  #28b07a;
  --color-primary-disabled: #1a5c41;

  --color-success-text:    #34d998;
  --color-success-surface: #0d2d20;
  --color-success-border:  #1a4a35;

  --color-danger:          #ff5a52;
  --color-danger-pressed:  #e04a43;
  --color-error-text:      #ff8077;
  --color-error-surface:   #2a1210;
  --color-error-border:    #4a2020;

  --color-warning-text:    var(--color-amber-500);
  --color-warning-surface: #261a05;
  --color-warning-border:  #3d2c0a;

  --color-info:            #4d93ff;
  --color-info-text:       #85b5ff;
  --color-info-surface:    #0a1428;
  --color-info-border:     #152240;
  --color-info-pressed:    #3a7aee;

  --color-track:    #38383a;

  --shadow-card:    none;
  --shadow-raised:  0 2px 8px rgba(0,0,0,.4);
  --shadow-overlay: 0 8px 32px rgba(0,0,0,.6);

  --color-chart-mint:  #30c88a;
  --color-chart-blue:  #4d93ff;
  --color-chart-cyan:  #40d0f0;
  --color-chart-amber: var(--color-amber-500);
  --color-chart-red:   #ff5a52;
}

/* 布局、文字与交互值来自用户提供的最新版样式。 */
:root {
  color-scheme: light;
  --font-family-base: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --line-height-base: 1.5;
  --font-size-title: clamp(28px, 5vw, 36px);
  --font-size-control: 15px;
  --font-size-body: 14px;
  --font-size-message: 13px;
  --font-size-label: 12px;
  --font-weight-title: 700;
  --font-weight-medium: 600;
  --line-height-title: 1.15;
  --tracking-title: -0.04em;
  --tracking-tight: -0.01em;
  --tracking-label: .04em;

  --page-width: 640px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --control-height: 44px;
  --row-min-height: 48px;
  --check-size: 20px;

  --radius-control: 8px;
  --radius-list: 14px;
  --radius-pill: 20px;
  --radius-round: 50%;

  --focus-ring-width: 2.5px;
  --focus-ring-offset: 2px;
  --focus-halo-width: 3.5px;
  --color-focus-halo: color-mix(in srgb, var(--color-primary) 16%, transparent);
  --color-on-primary-disabled: color-mix(in srgb, var(--color-on-primary) 60%, transparent);
  --opacity-delete-disabled: 0.4;

  --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --scale-pressed: 0.97;
}

[data-theme="dark"] {
  color-scheme: dark;
}
  </style>
  <style>
    * { box-sizing: border-box; }
    html { scroll-padding-top: var(--space-4); }
    body {
      margin: 0;
      color: var(--color-ink);
      background: var(--color-page);
      font-family: var(--font-family-base);
      line-height: var(--line-height-base);
      -webkit-font-smoothing: antialiased;
    }
    :is(button, input) { font: inherit; }
    :is(button, a, input):focus-visible {
      outline: var(--focus-ring-width) solid var(--color-primary);
      outline-offset: var(--focus-ring-offset);
    }
    button:enabled { cursor: pointer; }
    a { color: var(--color-link); }
    .container {
      width: min(calc(100% - 2 * var(--space-5)), calc(var(--page-width) + 280px));
      margin-inline: auto;
    }
    header { border-bottom: 1px solid var(--color-line); }
    .bar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .brand { font-size: var(--font-size-control); font-weight: var(--font-weight-title); }
    .theme {
      display: flex;
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--color-line);
      border-radius: var(--radius-control);
      background: var(--color-secondary);
    }
    .theme button {
      padding: 5px 12px;
      border: 0;
      border-radius: 5px;
      color: var(--color-secondary-ink);
      background: transparent;
      font-size: var(--font-size-message);
    }
    .theme button[aria-pressed="true"] {
      color: var(--color-ink);
      background: var(--color-card);
      box-shadow: var(--shadow-card);
      font-weight: var(--font-weight-medium);
    }
    .intro { padding: 44px 0 24px; }
    h1 {
      margin: 0;
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-title);
      line-height: var(--line-height-title);
      letter-spacing: var(--tracking-title);
    }
    .intro p, .section-heading p {
      margin: var(--space-2) 0 0;
      font-size: var(--font-size-body);
      color: var(--color-secondary-ink);
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2) var(--space-5);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-line);
    }
    nav a { font-size: var(--font-size-body); text-underline-offset: 4px; }
    section { margin-bottom: 42px; }
    h2 { margin: 0; font-size: 20px; letter-spacing: var(--tracking-tight); }
    h3 { margin: 0; font-size: var(--font-size-body); }
    .section-heading { margin-bottom: var(--space-3); }
    .panel {
      border: 1px solid var(--color-line);
      border-radius: var(--radius-list);
      background: var(--color-card);
      box-shadow: var(--shadow-card);
    }
    .specimens {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      overflow: hidden;
      background: var(--color-line);
    }
    .specimen, .token-row { min-width: 0; background: var(--color-card); }
    .specimen { padding: var(--space-4); }
    .specimen h3 { margin-bottom: var(--space-3); color: var(--color-secondary-ink); }
    .sample-controls { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .primary, .sample-input {
      min-height: var(--control-height);
      border-radius: var(--radius-control);
      font-size: var(--font-size-control);
    }
    .primary {
      border: 0;
      padding: 0 20px;
      background: var(--color-primary);
      color: var(--color-on-primary);
      font-weight: var(--font-weight-medium);
      transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .primary:enabled:hover, .primary:enabled:active {
      background: var(--color-primary-pressed);
    }
    .primary:enabled:active { transform: scale(var(--scale-pressed)); }
    .primary:disabled { background: var(--color-primary-disabled); color: var(--color-on-primary-disabled); }
    .sample-input {
      width: 100%;
      padding-inline: 14px;
      border: 1px solid var(--color-line);
      color: var(--color-ink);
      background: var(--color-field);
    }
    .sample-input::placeholder { color: var(--color-placeholder); }
    .sample-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 var(--focus-halo-width) var(--color-focus-halo);
    }
    .notice {
      margin: 0;
      padding: 9px 13px;
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-control);
      color: var(--color-error-text);
      background: var(--color-error-surface);
      font-size: var(--font-size-message);
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: var(--row-min-height);
      cursor: pointer;
      font-size: var(--font-size-control);
    }
    .check-row input {
      appearance: none;
      flex: 0 0 var(--check-size);
      height: var(--check-size);
      margin: 0;
      border: 1.5px solid var(--color-muted-ink);
      border-radius: var(--radius-round);
      display: grid;
      place-content: center;
      cursor: inherit;
    }
    .check-row input:checked { border-color: var(--color-primary); background: var(--color-primary); }
    .check-row input:checked::before {
      content: '';
      width: 8px;
      height: 5px;
      border: 2px solid var(--color-on-primary);
      border-top: none;
      border-right: none;
      transform: translateY(-1px) rotate(-45deg);
    }
    .ramps { padding: var(--space-4); }
    .ramp + .ramp { margin-top: var(--space-4); }
    .ramp-grid { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: var(--space-2); }
    .ramp h3 { margin-bottom: var(--space-2); }
    figure { margin: 0; }
    .swatch {
      height: 36px;
      border-radius: var(--radius-control);
      border: 1px solid color-mix(in srgb, var(--color-line) 55%, transparent);
      background: var(--sample);
    }
    figcaption {
      margin-top: var(--space-1);
      font-size: var(--font-size-label);
      font-variant-numeric: tabular-nums;
    }
    figcaption code { display: block; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    .value, figcaption code { color: var(--color-secondary-ink); }
    .palette-group + .palette-group, .token-group + .token-group { margin-top: var(--space-4); }
    .palette-group h3, .token-group h3 { margin: 0 0 var(--space-2); }
    .semantic-grid, .token-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 202px), 1fr));
      background: var(--color-line);
      gap: 1px;
      overflow: hidden;
    }
    .semantic-grid .token-row, .token-row { padding: var(--space-3); }
    .semantic-grid .swatch {
      width: 100%;
      height: 30px;
      margin-bottom: var(--space-2);
    }
    .token-name, .value { display: block; font-size: var(--font-size-label); }
    .value { margin-top: var(--space-1); }
    .token-sample {
      height: 34px;
      display: flex;
      align-items: center;
      padding-inline: var(--space-2);
      margin-bottom: var(--space-2);
      border-radius: var(--radius-control);
      background: var(--color-secondary);
      overflow: hidden;
    }
    .token-sample .chip { display: inline-block; background: var(--color-primary); min-width: 2px; }
    .token-sample[data-kind="radius"] .chip { width: 46px; height: 24px; border-radius: var(--sample); }
    .token-sample[data-kind="space"] .chip { width: var(--sample); height: 8px; }
    .token-sample[data-kind="shadow"] { overflow: visible; }
    .token-sample[data-kind="shadow"] .chip {
      width: 60px;
      height: 19px;
      border: 1px solid var(--color-line);
      border-radius: 4px;
      background: var(--color-card);
      box-shadow: var(--sample);
    }
    .type-sample { font-size: var(--sample); line-height: 1; white-space: nowrap; }
    .token-sample[data-kind="type"] { height: 44px; }
    @media (max-width: 680px) {
      .container { width: calc(100% - 2 * var(--space-4)); }
      .intro { padding-top: var(--space-6); }
      .specimens { grid-template-columns: 1fr; }
      .ramp-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .primary { transition: none; }
    }
    @media (forced-colors: active) {
      .check-row input { appearance: auto; }
      .check-row input:checked::before { content: none; }
      .primary { border: 1px solid ButtonText; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container bar">
      <span class="brand">Shiinapple</span>
      <div class="theme" role="group" aria-label="主题">
        <button type="button" data-set-theme="light" aria-pressed="true">浅色</button>
        <button type="button" data-set-theme="dark" aria-pressed="false">深色</button>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="intro">
      <h1>设计令牌</h1>
      <p>浏览实际色值、界面状态、字阶和间距。<span id="token-count"></span></p>
    </div>
    <nav aria-label="目录">
      <a href="#components">组件</a><a href="#palette">基础色阶</a><a href="#semantics">语义颜色</a><a href="#metrics">尺寸与动效</a>
    </nav>
    <section id="components">
      <div class="section-heading"><h2>组件预览</h2><p>悬停、按下按钮或按 Tab 查看交互状态。</p></div>
      <div class="panel specimens">
        <div class="specimen">
          <h3>主按钮</h3>
          <div class="sample-controls">
            <button class="primary" type="button">添加</button>
            <button class="primary" type="button" disabled>不可用</button>
          </div>
        </div>
        <div class="specimen"><h3><label for="sample-input">输入框</label></h3><input id="sample-input" class="sample-input" placeholder="输入一项任务"></div>
        <div class="specimen"><h3>选择状态</h3><label class="check-row"><input type="checkbox" checked> 完成色彩整理</label></div>
        <div class="specimen"><h3>错误反馈</h3><p class="notice">请输入任务名称。</p></div>
      </div>
    </section>
    <section id="palette">
      <div class="section-heading"><h2>基础色阶</h2><p>从 50 到 900。Amber 和 Red 随主题调整。</p></div>
      <div id="ramps" class="panel ramps"></div>
    </section>
    <section id="semantics">
      <div class="section-heading"><h2>语义颜色</h2></div>
      <div id="semantic-tokens"></div>
    </section>
    <section id="metrics">
      <div class="section-heading"><h2>尺寸、文字与动效</h2></div>
      <div id="other-tokens"></div>
    </section>
  </main>
  <script>
    const root = document.documentElement;
    const tokenSheet = document.querySelector('#design-tokens').sheet;
    const tokenNames = [...new Set([...tokenSheet.cssRules]
      .flatMap(rule => [...(rule.style ?? [])]).filter(name => name.startsWith('--')))];
    const rampPattern = /^--color-(mint|blue|cyan|amber|red)-(\d+)$/;
    const colors = tokenNames.filter(name => name.startsWith('--color-') && !rampPattern.test(name));
    const metrics = tokenNames.filter(name => !name.startsWith('--color-'));

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function tokenRow(name, value, sample) {
      const row = element('div', 'token-row');
      row.dataset.token = name;
      if (sample) row.append(sample);
      row.append(element('code', 'token-name', name), element('code', 'value', value));
      return row;
    }

    function swatch(value) {
      const sample = element('div', 'swatch');
      sample.style.setProperty('--sample', value);
      sample.setAttribute('aria-hidden', 'true');
      return sample;
    }

    function group(title, className, gridClass, items) {
      const wrapper = element('div', className);
      const grid = element('div', gridClass);
      wrapper.append(element('h3', '', title), grid);
      grid.append(...items);
      return wrapper;
    }

    function metricSample(name, value) {
      const kind = name.startsWith('--radius-') ? 'radius'
        : name.startsWith('--space-') ? 'space'
        : name.startsWith('--shadow-') ? 'shadow'
        : name.startsWith('--font-size-') ? 'type' : '';
      if (!kind) return null;

      const sample = element('div', 'token-sample');
      sample.dataset.kind = kind;
      sample.style.setProperty('--sample', value);
      sample.setAttribute('aria-hidden', 'true');
      sample.append(kind === 'type' ? element('span', 'type-sample', '字 Aa') : element('span', 'chip'));
      return sample;
    }

    function render() {
      const style = getComputedStyle(root);
      const value = name => style.getPropertyValue(name).trim();
      const ramps = ['Mint', 'Blue', 'Cyan', 'Amber', 'Red'].map(family => {
        const names = tokenNames.filter(name => name.startsWith('--color-' + family.toLowerCase() + '-') && rampPattern.test(name));
        return group(family, 'ramp', 'ramp-grid', names.map(name => {
          const step = name.match(rampPattern)[2];
          const figure = element('figure');
          figure.dataset.token = name;
          figure.title = name;
          const caption = element('figcaption', '', step);
          caption.append(element('code', 'value', value(name)));
          figure.append(swatch(value(name)), caption);
          return figure;
        }));
      });
      document.querySelector('#ramps').replaceChildren(...ramps);

      const isBrand = name => /-(primary|link|focus)/.test(name);
      const isStatus = name => /--color-(success|danger|error|warning|info)/.test(name);
      const isChart = name => name.startsWith('--color-chart-');
      const colorGroups = [
        ['底色和文字', colors.filter(name => !isBrand(name) && !isStatus(name) && !isChart(name))],
        ['品牌与焦点', colors.filter(isBrand)],
        ['状态反馈', colors.filter(isStatus)],
        ['图表', colors.filter(isChart)],
      ];
      document.querySelector('#semantic-tokens').replaceChildren(...colorGroups.map(([title, names]) =>
        group(title, 'palette-group', 'panel semantic-grid', names.map(name => tokenRow(name, value(name), swatch(value(name)))))));

      const dimensions = name => /--(page|space|control|row|check|radius|focus)/.test(name);
      const typography = name => /--(font|line-height|tracking)/.test(name);
      const shadow = name => name.startsWith('--shadow-');
      const metricGroups = [
        ['文字', metrics.filter(typography)],
        ['布局、圆角和轮廓', metrics.filter(dimensions)],
        ['阴影', metrics.filter(shadow)],
        ['动效与透明度', metrics.filter(name => !typography(name) && !dimensions(name) && !shadow(name))],
      ];
      document.querySelector('#other-tokens').replaceChildren(...metricGroups.map(([title, names]) =>
        group(title, 'token-group', 'panel token-grid', names.map(name => tokenRow(name, value(name), metricSample(name, value(name)))))));
      document.querySelector('#token-count').textContent = '共 ' + tokenNames.length + ' 个令牌。';
    }

    const themeButtons = [...document.querySelectorAll('[data-set-theme]')];
    for (const button of themeButtons) {
      button.addEventListener('click', () => {
        root.dataset.theme = button.dataset.setTheme;
        for (const other of themeButtons) {
          other.setAttribute('aria-pressed', String(other === button));
        }
        render();
      });
    }
    render();
  </script>
</body>
</html>
