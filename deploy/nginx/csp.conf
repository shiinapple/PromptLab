# M2 candidate. Include in the HTTPS server/location that serves the SPA.
# Review allowed model origins during M6. Only connect-src allows configurable HTTPS targets.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header Referrer-Policy "no-referrer" always;
